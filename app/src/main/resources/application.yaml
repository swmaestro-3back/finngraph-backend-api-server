spring:
  application:
    name: backend-server

  # ETL이 적재한 Postgres. 런타임 계정은 SELECT 전용이며 hikari.read-only로 이중 차단한다.
  # flyway-core가 의존성에 없으므로 spring.flyway.* 설정 자체가 불필요하다.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      read-only: true
      pool-name: finngraph-read

  jooq:
    sql-dialect: postgres

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        finngraph.query.count: 0.5,0.95,0.99

finngraph:
  bench:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: bench

finngraph:
  bench:
    enabled: true
