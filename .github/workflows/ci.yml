name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: test results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        with:
          name: app-jar
          path: |
            app/build/libs/*.jar
            !app/build/libs/*-plain.jar
          if-no-files-found: error
          retention-days: 1

  flyway-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      app-db:
        image: postgres:17
        env:
          POSTGRES_DB: finngraph_app
          POSTGRES_USER: finngraph_app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finngraph_app -d finngraph_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew flywayMigrate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/finngraph_app
          FLYWAY_USER: finngraph_app
          FLYWAY_PASSWORD: app

  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@v4

  deliver:
    needs: [build, flyway-migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: swmaestro-3back/github-actions/.github/workflows/docker.delivery.yaml@main
    with:
      image_name: finngraph/backend-api
      dockerfile: docker/app.Dockerfile
      build_artifact: app-jar
      build_artifact_path: app/build/libs
    secrets:
      oidc_role_arn: ${{ secrets.OIDC_ROLE_ARN }}

  deploy:
    needs: deliver
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: 배포
        uses: swmaestro-3back/github-actions/actions/ssm-deploy@main
        with:
          instance_id: ${{ secrets.DEPLOY_INSTANCE_ID }}
          compose_dir: /home/ubuntu/finngraph
          compose_file: docker-compose.yml
          service: app
          image_env_var: BACKEND_IMAGE
          image_name: finngraph/backend-api
          image_digest: ${{ needs.deliver.outputs.image_digest }}
          health_url: http://127.0.0.1:8080/actuator/health
