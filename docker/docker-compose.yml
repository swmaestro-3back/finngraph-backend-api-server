name: finngraph-backend

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    container_name: finngraph-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finngraph
      SPRING_DATASOURCE_USERNAME: ${ETL_DB_USER:-threeback}
      SPRING_DATASOURCE_PASSWORD: ${ETL_DB_PASSWORD:-12345678}
      APP_DATASOURCE_URL: jdbc:postgresql://app-db:5432/finngraph_app
      APP_DATASOURCE_USERNAME: ${APP_DB_RUNTIME_USER:-finngraph_app_runtime}
      APP_DATASOURCE_PASSWORD: ${APP_DB_RUNTIME_PASSWORD:-app}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      TZ: Asia/Seoul
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - etl
      - default

  app-db:
    image: postgres:17
    container_name: finngraph-app-db
    environment:
      POSTGRES_DB: finngraph_app
      POSTGRES_USER: ${APP_DB_USER:-finngraph_app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${APP_DB_USER:-finngraph_app} -d finngraph_app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: finngraph-redis
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-db-data:
  redis-data:

networks:
  etl:
    external: true
    name: finngraph-etl_default
