name: ci

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: test results
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          retention-days: 7

  flyway-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      app-db:
        image: postgres:17
        env:
          POSTGRES_DB: finngraph_app
          POSTGRES_USER: finngraph_app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finngraph_app -d finngraph_app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew flywayMigrate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/finngraph_app
          FLYWAY_USER: finngraph_app
          FLYWAY_PASSWORD: app

  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@v4
